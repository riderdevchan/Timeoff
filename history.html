<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติการบันทึกเวลา</title>
  <style>
    body {
      font-family: 'Sarabun', sans-serif, Tahoma;
      background-color: #f4f7f6;
      padding: 30px 15px;
    }
    .container {
      max-width: 950px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
      font-size: 14px;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .actions {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-weight: bold;
    }
    .btn-back {
      background-color: #6c757d;
      color: white;
    }
    .btn-clear {
      background-color: #dc3545;
      color: white;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>ประวัติการบันทึกเวลาทั้งหมด</h2>

  <table>
    <thead>
      <tr>
        <th>เวลาที่บันทึก</th>
        <th>พัก 1</th>
        <th>เริ่มงาน</th>
        <th>ช่วงที่ 1</th>
        <th>พัก 2</th>
        <th>ปิดระบบ</th>
        <th>ช่วงที่ 2</th>
        <th style="background-color: #28a745;">รวมทั้งหมด</th>
      </tr>
    </thead>
    <tbody id="table-body">
    </tbody>
  </table>

  <div class="actions">
    <a href="index.html" class="btn btn-back">กลับไปหน้าคำนวณ</a>
    <button class="btn btn-clear" onclick="clearData()">ล้างประวัติทั้งหมด</button>
  </div>
</div>

<script>
  function renderTable() {
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';
    const records = JSON.parse(localStorage.getItem('workTimeRecords') || '[]');

    if (records.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="color: gray;">ยังไม่มีข้อมูลที่ถูกบันทึก</td></tr>`;
      return;
    }

    records.slice().reverse().forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row.date}</td>
        <td>${row.t1}</td>
        <td>${row.t2}</td>
        <td>${row.diff1}</td>
        <td>${row.t3}</td>
        <td>${row.t4}</td>
        <td>${row.diff2}</td>
        <td style="font-weight: bold; color: #28a745;">${row.totalText}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function clearData() {
    if (confirm("คุณต้องการลบประวัติการบันทึกทั้งหมดหรือไม่?")) {
      localStorage.removeItem('workTimeRecords');
      renderTable();
    }
  }

  renderTable();
</script>

</body>
</html>
